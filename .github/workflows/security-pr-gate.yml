# bloxwap/.github -> .github/workflows/security-pr-gate.yml  (reusable, PUBLIC repo)
# Fast PR/push gate. Two independent jobs, no needs: between them. Only NEW risk is checked:
# lockfiles changed in this PR/push (osv.dev API) and the commits in this PR/push (gitleaks).
# Same fail rule as the nightly/release scan: CVSS >= fail-cvss AND a fix exists. No Slack on PRs.
name: security-pr-gate

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: '["self-hosted","macOS","ARM64"]'
      fail-cvss:
        type: string
        default: "7.0"

env:
  OSV_URL: https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_darwin_arm64
  OSV_SHA256: d4926ef8da134332543be276dff157e4c170f99ad91fc48e89448a8816bdf70b
  GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
  GITLEAKS_SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
  # PR: base..head of the PR. Push: before..after. New branch push (before = 0000...): last commit only.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  changed-lockfiles:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0          # needed to diff against the base; the reused .git on self-hosted keeps this cheap
          persist-credentials: false
      - name: Find changed lockfiles
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if echo "$BASE_SHA" | grep -qE '^0+$|^$'; then RANGE="HEAD~1 HEAD"; else RANGE="$(git merge-base "$BASE_SHA" HEAD) HEAD"; fi
          # shellcheck disable=SC2086
          git diff --name-only $RANGE | grep -E '(^|/)(bun\.lock|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|uv\.lock|requirements[^/]*\.txt|poetry\.lock|Cargo\.lock|go\.sum)$' > lockfiles.txt || true
          echo "count=$(wc -l < lockfiles.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          { echo "### Changed lockfiles"; sed 's/^/- /' lockfiles.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: OSV (osv.dev API) on changed lockfiles only
        if: steps.diff.outputs.count != '0'
        shell: bash
        env:
          FLOOR: ${{ inputs.fail-cvss }}
        run: |
          set -uo pipefail
          d="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/bloxwap-scan/$OSV_SHA256"; mkdir -p "$d"
          if [ ! -f "$d/pkg" ]; then curl -fsSL --retry 3 -o "$d/pkg.$$" "$OSV_URL" && mv -f "$d/pkg.$$" "$d/pkg"; fi
          echo "$OSV_SHA256  $d/pkg" | shasum -a 256 -c - >/dev/null || { rm -f "$d/pkg"; exit 2; }
          OSV="$RUNNER_TEMP/osv-scanner"; install -m 0755 "$d/pkg" "$OSV"
          CFG=""; [ -f osv-scanner.toml ] && CFG="--config=osv-scanner.toml"
          LF=""; while IFS= read -r f; do [ -f "$f" ] && LF="$LF -L $f"; done < lockfiles.txt
          [ -z "$LF" ] && exit 0      # lockfiles were deleted, nothing to scan
          # shellcheck disable=SC2086
          "$OSV" scan source $CFG $LF --format json --output-file osv.json; rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::warning::osv.dev API unreachable (rc=$rc); falling back to a one-off OSV database download"
            export OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY="$RUNNER_TEMP/osv-db"
            # shellcheck disable=SC2086
            "$OSV" scan source $CFG $LF --offline-vulnerabilities --download-offline-databases --format json --output-file osv.json; rc=$?
            rm -rf "$RUNNER_TEMP/osv-db"
          fi
          if [ "$rc" -gt 1 ]; then echo "::error::osv-scanner failed (rc=$rc)"; exit "$rc"; fi
          cat > "$RUNNER_TEMP/osv-gate.jq" <<'JQ'
          def vnum: [ (sub("^v";"") | split("+")[0] | split("-")[0] | split(".")[] | (tonumber? // 0)) ];
          [ .results[]? | (.source.path | ltrimstr($root)) as $src | .packages[]? as $p
            | select(($p.package.version // "") | test("^v?[0-9]"))
            | $p.groups[]? as $g
            | (($g.max_severity // "") | tonumber? // 0) as $sev
            | [ $p.vulnerabilities[]? | select(.id as $i | $g.ids | index($i))
                | .affected[]? | select(.package.name == $p.package.name and .package.ecosystem == $p.package.ecosystem)
                | .ranges[]?.events[]? | .fixed // empty
                | select(vnum > ($p.package.version | vnum)) ] as $fixes
            | { source: $src, ecosystem: $p.package.ecosystem, package: $p.package.name,
                version: $p.package.version, id: $g.ids[0], severity: $sev,
                fixed: (($fixes | sort_by(vnum) | first) // null) } ]
          | unique_by([.source, .package, .version, .id])
          | { fail:        [ .[] | select(.severity >= ($min | tonumber) and .fixed != null) ],
              report_only: [ .[] | select(.severity <  ($min | tonumber) or  .fixed == null) ] }
          JQ
          jq --arg min "$FLOOR" --arg root "$PWD/" -f "$RUNNER_TEMP/osv-gate.jq" osv.json > osv-gate.json || exit 2
          FAIL=$(jq '.fail | length' osv-gate.json)
          {
            echo "### Dependencies: $FAIL fixable at CVSS >= $FLOOR, $(jq '.report_only | length' osv-gate.json) report-only"
            jq -r '(.fail[] | "- FAIL \(.package)@\(.version) \(.id) [\(.severity)] -> \(.fixed) (\(.source))"),
                   (.report_only[] | "- report \(.package)@\(.version) \(.id) [\(.severity)] -> \(.fixed // "no fix yet")")' osv-gate.json
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$FAIL" -eq 0 ]

  secrets-diff:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks on this PR/push's commits only (redacted)
        shell: bash
        run: |
          set -uo pipefail
          BIN="$RUNNER_TEMP/scan-bin"; d="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/bloxwap-scan/$GITLEAKS_SHA256"; mkdir -p "$BIN" "$d"
          if [ ! -f "$d/pkg" ]; then curl -fsSL --retry 3 -o "$d/pkg.$$" "$GITLEAKS_URL" && mv -f "$d/pkg.$$" "$d/pkg"; fi
          echo "$GITLEAKS_SHA256  $d/pkg" | shasum -a 256 -c - >/dev/null || { rm -f "$d/pkg"; exit 2; }
          tar -xzf "$d/pkg" -C "$BIN" gitleaks
          if echo "$BASE_SHA" | grep -qE '^0+$|^$'; then RANGE="HEAD~1..HEAD"; else RANGE="$(git merge-base "$BASE_SHA" HEAD)..HEAD"; fi
          # .gitleaksignore / .gitleaks.toml in the repo root are picked up automatically
          "$BIN/gitleaks" git --redact --no-banner --exit-code 1 --log-opts="$RANGE" .
